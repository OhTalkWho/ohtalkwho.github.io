<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT Grammar Randomizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
        <div class="title-container">
          <h1>JLPT Grammar Randomizer</h1>
          <p>Practice random grammar points for conversation, writing, or review</p>
          <nav>
            <a href="JLPTMath.html">Calculator</a> |
            <a href="index.html">Grammar Randomizer</a>
          </nav>
        </div>
      </header>

  <main>
    <form id="grammar-form">
      <h2>Select JLPT Levels</h2>
      <label><input type="checkbox" value="N5"> N5</label>
      <label><input type="checkbox" value="N4"> N4</label>
      <label><input type="checkbox" value="N3"> N3</label>
      <label><input type="checkbox" value="N2"> N2</label>
      <label><input type="checkbox" value="N1"> N1</label>

      <h2>How many grammar points?</h2>
      <input type="number" id="count" min="1" max="50" value="5">

      <button type="submit">Generate</button>
    </form>

    <section id="results"></section>
  </main>

  <footer>
    <p>Powered by JLPT Sensei | Made with 🦊</p>
  </footer>

  <!-- Load grammar data first -->
  <script src="grammar-data.js"></script>
  <script src="grammar.js"></script>
</body>

</html>
